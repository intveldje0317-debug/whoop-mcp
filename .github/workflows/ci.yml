name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test with coverage
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Audit production dependencies
        if: matrix.node-version == '22.x'
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  collector:
    name: Collector and Dashboard
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            collector/package-lock.json
      - name: Install dependencies
        run: npm ci && npm ci --prefix collector
      - name: Verify collector and dashboard
        run: |
          npm --prefix collector run typecheck
          npm --prefix collector run lint
          npm --prefix collector run format:check
          npm --prefix collector test
          npm --prefix collector run build
          npm --prefix collector run build:dashboard
          npm audit --prefix collector --audit-level=high
